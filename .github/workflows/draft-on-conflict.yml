name: Draft on conflict

# A ready pull request that no longer merges is converted to a draft, with a comment (see .github/scripts/draft-conflicting.sh).
# push to master: other pull requests can become conflicting right then. pull_request_target: GitHub does not run pull_request workflows
# on a PR that has merge conflicts but does run this one, so a PR marked ready while it conflicts is drafted again. It never checks out
# or runs PR code (only .github/scripts from the base ref). workflow_dispatch: run it by hand.
#
# The default GITHUB_TOKEN is refused for converting a pull request to draft ("Resource not accessible by integration"),
# so this needs a repository secret DRAFT_TOKEN: a fine-grained personal access token for this repository with
# "Pull requests: read and write". Without it the job only warns and does nothing (recipe-dev works the same way with RECIPE_POLICY_TOKEN).
on:
  push:
    branches: [master]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draft-on-conflict
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Convert conflicting pull requests to draft
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::repository secret DRAFT_TOKEN is not set, so this job did nothing (GITHUB_TOKEN cannot convert a pull request to draft)"
            exit 0
          fi
          .github/scripts/draft-conflicting.sh | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.DRAFT_TOKEN }}
