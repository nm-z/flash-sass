name: PR audit

# Runs on every push to a pull request branch (and when the description is edited, so a missing issue link can be fixed).
# Fails when the PR adds files in a language this repository does not use, or does not link an existing issue.
# The same script runs locally: PR=<number> .github/scripts/pr-audit.sh
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Audit pull request
        shell: bash
        run: .github/scripts/pr-audit.sh | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
